[project]
name = "nhlscreen"
version = "0.1.0"
description = "Backend data service for a DIY NHL LED scoreboard"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
    "pydantic>=2.6",
    "pyyaml>=6",
    "tzdata; sys_platform == 'win32'",  # Windows has no IANA zone database for zoneinfo
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
nhlscreen = "nhlscreen.__main__:main"
displayteam = "nhlscreen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nhlscreen = ["api/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
