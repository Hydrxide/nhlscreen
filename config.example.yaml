# Copy to config.yaml and edit. Every key is optional; defaults are shown.

favorite_teams: [TOR]
# NHL player IDs (the number in an nhl.com/player/... URL).
favorite_players: [8486067, 8475683]   # Gavin McKenna, Sergei Bobrovsky
timezone: America/Toronto

server:
  host: 127.0.0.1     # use 0.0.0.0 to let other devices on your LAN reach it
  port: 9134

polling:
  live_poll_seconds: 2        # favorite team live play-by-play (min 2)
  live_stats_seconds: 30      # SOG / faceoffs / PP stats during favorite game
  scoreboard_live_seconds: 20 # league scores while any game is live
  scoreboard_pregame_seconds: 60
  scoreboard_idle_seconds: 900
  standings_seconds: 3600
  leaders_seconds: 3600
  schedule_seconds: 21600
  players_seconds: 3600

display:
  alert_seconds: 15            # how long a goal alert holds the screen
  final_alert_seconds: 20
  rotate_during_intermission: true
  scoreboard_games_per_page: 4
  leaders_limit: 5
  rotation:                    # shown when no favorite game is live
    - {screen: next_game, dwell: 10}
    - {screen: scoreboard, dwell: 8}      # one screen per page of games
    - {screen: standings, scope: division, dwell: 12}   # only divisions with a followed team
    - {screen: standings, scope: wildcard, dwell: 12}   # followed teams' conferences
    - {screen: standings, scope: league, dwell: 10}     # all 32 teams, 4 pages
    - {screen: leaders, dwell: 8}         # one screen per leader category
    - {screen: player_card, dwell: 8}     # one screen per favorite player

leaders:
  skater_categories: [points, goals, assists]
  goalie_categories: [wins, savePctg]
